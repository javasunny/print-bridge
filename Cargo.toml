[package]
name = "print-bridge"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
base64 = "0.22"
fs2 = "0.4"
lopdf = "0.38"
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }

[dev-dependencies]
http-body = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
