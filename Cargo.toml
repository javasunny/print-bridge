[package]
name = "print-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/javasunny/print-bridge"
description = "Local IPP print bridge for Windows and Apple devices"

[dependencies]
axum = "0.8"
base64 = "0.22"
fs2 = "0.4"
http-body-util = "0.1"
jpeg-decoder = { version = "0.3", default-features = false }
lopdf = "0.38"
mdns-sd = "0.21.6"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Printing"] }

[dev-dependencies]
http-body = "1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
