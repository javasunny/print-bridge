[package]
name = "print-bridge-desktop"
version = "0.1.4"
edition = "2021"
publish = false

[dependencies]
print-bridge = { path = ".." }
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
strip = true
